<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Tabs</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container mt-5">

<div class="main-box">

<h1 class="text-center text-primary mb-5">
Community Event Dashboard
</h1>

<ul class="nav nav-pills nav-justified mb-4"
id="eventTabs">

<li class="nav-item">

<button class="nav-link active"
data-bs-toggle="pill"
data-bs-target="#music">

<i class="bi bi-music-note-beamed"></i>
Music

</button>

</li>

<li class="nav-item">

<button class="nav-link"
data-bs-toggle="pill"
data-bs-target="#sports">

<i class="bi bi-trophy-fill"></i>
Sports

</button>

</li>

<li class="nav-item">

<button class="nav-link"
data-bs-toggle="pill"
data-bs-target="#food">

<i class="bi bi-cup-hot-fill"></i>
Food

</button>

</li>

</ul>

<div class="tab-content">

<div class="tab-pane fade show active"
id="music">

<div class="content-box">

<h2 class="text-danger">
Music Festival
</h2>

<p>
Enjoy live concerts and entertainment programs with famous artists.
</p>

<button class="btn btn-danger">
Register Now
</button>

</div>

</div>

<div class="tab-pane fade"
id="sports">

<div class="content-box">

<h2 class="text-success">
Sports Competition
</h2>

<p>
Participate in exciting indoor and outdoor sports events.
</p>

<button class="btn btn-success">
Join Event
</button>

</div>

</div>

<div class="tab-pane fade"
id="food">

<div class="content-box">

<h2 class="text-warning">
Food Carnival
</h2>

<p>
Taste delicious foods and explore different cuisines.
</p>

<button class="btn btn-warning">
Explore Foods
</button>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
