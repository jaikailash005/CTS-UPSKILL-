<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap List Group</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container mt-5">

<div class="main-box">

<h1 class="text-center text-primary mb-5">
Community Event Categories
</h1>

<div class="list-group mb-4">

<button class="list-group-item list-group-item-action active"
data-bs-toggle="collapse"
data-bs-target="#musicContent">

<i class="bi bi-music-note-beamed"></i>
Music Events

</button>

<div class="collapse show"
id="musicContent">

<div class="content-box">

Live concerts, DJ nights, and cultural music programs available.

</div>

</div>

<button class="list-group-item list-group-item-action"
data-bs-toggle="collapse"
data-bs-target="#sportsContent">

<i class="bi bi-trophy-fill"></i>
Sports Events

</button>

<div class="collapse"
id="sportsContent">

<div class="content-box">

Indoor and outdoor sports competitions for all age groups.

</div>

</div>

<button class="list-group-item list-group-item-action"
data-bs-toggle="collapse"
data-bs-target="#foodContent">

<i class="bi bi-cup-hot-fill"></i>
Food Festivals

</button>

<div class="collapse"
id="foodContent">

<div class="content-box">

Explore delicious foods and special cuisines from various places.

</div>

</div>

</div>

<button class="btn btn-primary btn-lg w-100">
Explore More Events
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
