<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Product Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container py-5">

<h1 class="text-center text-primary fw-bold mb-5">
Community Store
</h1>

<div class="row g-4">

<div class="col-md-4">

<div class="card product-card h-100">

<span class="badge bg-danger product-badge">
New
</span>

<img src="images/product1.jpg"
class="card-img-top product-image">

<div class="card-body text-center">

<h3 class="card-title">
Event T-Shirt
</h3>

<p class="text-success fs-5">
₹499
</p>

<div class="mb-3">

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-half text-warning"></i>

</div>

<button class="btn btn-primary w-100">
Add To Cart
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card product-card h-100">

<span class="badge bg-success product-badge">
Sale
</span>

<img src="images/product2.jpg"
class="card-img-top product-image">

<div class="card-body text-center">

<h3 class="card-title">
Coffee Mug
</h3>

<p class="text-success fs-5">
₹299
</p>

<div class="mb-3">

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

</div>

<button class="btn btn-success w-100">
Buy Now
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card product-card h-100">

<span class="badge bg-primary product-badge">
Popular
</span>

<img src="images/product3.jpg"
class="card-img-top product-image">

<div class="card-body text-center">

<h3 class="card-title">
Event Cap
</h3>

<p class="text-success fs-5">
₹199
</p>

<div class="mb-3">

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star-fill text-warning"></i>

<i class="bi bi-star text-warning"></i>

</div>

<button class="btn btn-danger w-100">
Order Now
</button>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
