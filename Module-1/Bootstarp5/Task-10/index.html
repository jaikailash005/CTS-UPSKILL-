<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Offcanvas</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<nav class="navbar navbar-dark bg-dark p-3">

<div class="container-fluid">

<a class="navbar-brand text-warning fw-bold"
href="#">

Community Portal

</a>

<button class="btn btn-warning"
type="button"
data-bs-toggle="offcanvas"
data-bs-target="#sidebarMenu">

<i class="bi bi-list"></i>
Menu

</button>

</div>

</nav>

<div class="offcanvas offcanvas-start"
tabindex="-1"
id="sidebarMenu">

<div class="offcanvas-header">

<h2 class="offcanvas-title text-primary">
Menu
</h2>

<button type="button"
class="btn-close"
data-bs-dismiss="offcanvas">

</button>

</div>

<div class="offcanvas-body">

<ul class="list-group">

<li class="list-group-item">
<i class="bi bi-house-fill"></i>
Home
</li>

<li class="list-group-item">
<i class="bi bi-calendar-event-fill"></i>
Events
</li>

<li class="list-group-item">
<i class="bi bi-images"></i>
Gallery
</li>

<li class="list-group-item">
<i class="bi bi-telephone-fill"></i>
Contact
</li>

<li class="list-group-item">
<i class="bi bi-person-fill"></i>
Profile
</li>

</ul>

</div>

</div>

<div class="container mt-5">

<div class="main-box text-center">

<h1 class="text-danger fw-bold">
Welcome To Community Event Portal
</h1>

<p class="lead text-success mt-4">
Explore events, activities, and community programs easily.
</p>

<button class="btn btn-primary btn-lg mt-3">
Explore Events
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
