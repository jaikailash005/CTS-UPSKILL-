<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Toast</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container mt-5">

<div class="main-box text-center">

<h1 class="text-primary fw-bold">
Community Event Notifications
</h1>

<p class="lead text-success mt-4">
Click the button to receive event notification.
</p>

<button class="btn btn-primary btn-lg mt-3"
id="toastButton">

Show Notification

</button>

</div>

</div>

<div class="toast-container position-fixed bottom-0 end-0 p-4">

<div id="eventToast"
class="toast">

<div class="toast-header">

<i class="bi bi-bell-fill text-warning me-2"></i>

<strong class="me-auto">
Event Alert
</strong>

<small>
Now
</small>

<button type="button"
class="btn-close"
data-bs-dismiss="toast">

</button>

</div>

<div class="toast-body">

New Music Festival Registration Started!

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

let toastButton=
document.getElementById("toastButton");

let toastElement=
document.getElementById("eventToast");

let toast=
new bootstrap.Toast(toastElement);

toastButton.addEventListener("click",function(){

toast.show();

});

</script>

</body>

</html>
