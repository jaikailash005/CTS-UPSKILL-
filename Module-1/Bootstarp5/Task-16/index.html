<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Pricing Cards</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container mt-5">

<h1 class="text-center text-primary mb-5">
Community Event Membership Plans
</h1>

<div class="row g-4">

<div class="col-md-4">

<div class="card pricing-card text-center">

<div class="card-body">

<i class="bi bi-person-fill pricing-icon text-primary"></i>

<h2 class="card-title mt-3">
Basic
</h2>

<h3 class="price text-success">
₹499
</h3>

<ul class="list-group list-group-flush mt-4">

<li class="list-group-item">
Access To Music Events
</li>

<li class="list-group-item">
Community Meetups
</li>

<li class="list-group-item">
Basic Support
</li>

</ul>

<button class="btn btn-primary btn-lg mt-4">
Choose Plan
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card pricing-card premium-card text-center">

<div class="card-body">

<i class="bi bi-star-fill pricing-icon text-warning"></i>

<h2 class="card-title mt-3">
Premium
</h2>

<h3 class="price text-danger">
₹999
</h3>

<ul class="list-group list-group-flush mt-4">

<li class="list-group-item">
All Event Access
</li>

<li class="list-group-item">
VIP Seating
</li>

<li class="list-group-item">
Priority Support
</li>

</ul>

<button class="btn btn-warning btn-lg mt-4">
Choose Plan
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card pricing-card text-center">

<div class="card-body">

<i class="bi bi-gem pricing-icon text-success"></i>

<h2 class="card-title mt-3">
Ultimate
</h2>

<h3 class="price text-primary">
₹1499
</h3>

<ul class="list-group list-group-flush mt-4">

<li class="list-group-item">
Unlimited Access
</li>

<li class="list-group-item">
Free Food Coupons
</li>

<li class="list-group-item">
24/7 Premium Support
</li>

</ul>

<button class="btn btn-success btn-lg mt-4">
Choose Plan
</button>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
