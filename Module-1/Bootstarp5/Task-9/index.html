<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bootstrap Cards</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<div class="container mt-5">

<h1 class="text-center text-primary mb-5">
Community Event Cards
</h1>

<div class="row g-4">

<div class="col-md-4">

<div class="card custom-card">

<img src="images/event1.jpg"
class="card-img-top card-image">

<div class="card-body text-center">

<h3 class="card-title text-danger">
<i class="bi bi-music-note-beamed"></i>
Music Festival
</h3>

<p class="card-text">
Enjoy live music performances and entertainment events.
</p>

<button class="btn btn-primary">
Register
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card custom-card">

<img src="images/event2.jpg"
class="card-img-top card-image">

<div class="card-body text-center">

<h3 class="card-title text-success">
<i class="bi bi-trophy-fill"></i>
Sports Event
</h3>

<p class="card-text">
Participate in exciting sports competitions and activities.
</p>

<button class="btn btn-success">
Join Now
</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card custom-card">

<img src="images/event3.jpg"
class="card-img-top card-image">

<div class="card-body text-center">

<h3 class="card-title text-warning">
<i class="bi bi-cup-hot-fill"></i>
Food Carnival
</h3>

<p class="card-text">
Taste delicious foods and enjoy community celebrations.
</p>

<button class="btn btn-warning">
Explore
</button>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
