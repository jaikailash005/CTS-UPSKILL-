<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Local Community Event Portal</title>

<style>

body{
background-color:lightyellow;
background-image:url("images/background.jpg");
background-size:cover;
background-repeat:no-repeat;
background-attachment:fixed;
font-family:Verdana;
line-height:1.8;
}

section{
background-color:rgba(255,255,255,0.8);
padding:30px;
margin:30px;
border-radius:20px;
border:3px solid white;
box-shadow:5px 5px 15px gray;
}

header{
background:linear-gradient(to right,blue,purple);
padding:20px;
color:white;
margin:20px;
border-radius:15px;
}

h1{
text-align:center;
text-transform:uppercase;
letter-spacing:2px;
}

h2{
font-size:40px;
font-weight:bold;
}

.content{
font-size:22px;
font-style:italic;
}

.info{
font-size:28px;
font-weight:bold;
text-transform:capitalize;
}

.ctaButton{
background-color:orange;
color:white;
padding:15px 25px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;
width:200px;
height:60px;
opacity:0.9;
}

.ctaButton:hover{
opacity:1;
background-color:darkorange;
}

</style>

<link rel="stylesheet" href="5_styles.css">

</head>

<body>

<h1 style="color:red;">
Welcome to Local Community Event Portal
</h1>

<header>

<h2>Community Events</h2>

</header>

<section>

<p class="content">
This portal helps residents register for events and activities.
</p>

<button class="ctaButton">
Register Now
</button>

</section>

<section>

<h3 id="mainHeading">
Upcoming Activities
</h3>

<p class="info">
Music Event On Sunday
</p>

<p class="info">
Sports Event On Monday
</p>

<div>
Community Meetup
</div>

</section>

</body>

</html>
